name: Desktop browser regressions
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-browser.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-browser.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - run: npm ci
        working-directory: apps/desktop/browser-tests
      - run: npx playwright install --with-deps chromium
        working-directory: apps/desktop/browser-tests
      - run: npm test
        working-directory: apps/desktop/browser-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-chromium-results
          path: |
            apps/desktop/browser-tests/test-results
            apps/desktop/browser-tests/playwright-report
