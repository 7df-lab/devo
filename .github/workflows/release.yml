name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RIPGREP_VERSION: 15.1.0

jobs:
  # ── Per-target: compile devo once, then package CLI and/or desktop ───────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_target: x86_64-linux-musl
            ext: ""
            package_cli: true
            package_desktop: true
            desktop_platform: linux
            desktop_arch: x64
            rg_target: x86_64-unknown-linux-musl
            electron_args: --linux --x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_target: aarch64-linux-musl
            ext: ""
            package_cli: true
            package_desktop: true
            desktop_platform: linux
            desktop_arch: arm64
            rg_target: aarch64-unknown-linux-gnu
            electron_args: --linux --arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            package_cli: true
            package_desktop: true
            desktop_platform: mac
            desktop_arch: arm64
            rg_target: aarch64-apple-darwin
            electron_args: --mac --arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            package_cli: true
            package_desktop: true
            desktop_platform: mac
            desktop_arch: x64
            rg_target: x86_64-apple-darwin
            electron_args: --mac --x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            package_cli: true
            package_desktop: true
            desktop_platform: windows
            desktop_arch: x64
            rg_target: x86_64-pc-windows-msvc
            electron_args: --win --x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: ".exe"
            package_cli: true
            package_desktop: true
            desktop_platform: windows
            desktop_arch: arm64
            rg_target: aarch64-pc-windows-msvc
            electron_args: --win --arm64

    env:
      RELEASE_TARGET: ${{ matrix.asset_target || matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Build release binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo zigbuild --release --target ${{ matrix.target }} -p devo-cli

      - name: Build release binary (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target ${{ matrix.target }} -p devo-cli

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --target ${{ matrix.target }} -p devo-cli

      - name: Strip symbols (macOS)
        if: runner.os == 'macOS'
        run: |
          strip target/${{ matrix.target }}/release/devo${{ matrix.ext }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"

      - name: Install Linux packaging dependencies
        if: matrix.package_desktop && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Download ripgrep sidecar (Linux/macOS)
        if: matrix.package_desktop && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="ripgrep-${RIPGREP_VERSION}-${{ matrix.rg_target }}.tar.gz"
          tmp_dir="$(mktemp -d)"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${archive}" -o "${tmp_dir}/${archive}"
          tar -xzf "${tmp_dir}/${archive}" -C "$tmp_dir"
          rg_bin="$(find "$tmp_dir" -type f -name rg | sed -n '1p')"
          if [ -z "$rg_bin" ]; then
            echo "rg not found in ${archive}" >&2
            exit 1
          fi
          chmod +x "$rg_bin"
          file "$rg_bin" || true
          echo "DEVO_DESKTOP_RUNTIME_RG_BIN=$rg_bin" >> "$GITHUB_ENV"

      - name: Download ripgrep sidecar (Windows)
        if: matrix.package_desktop && runner.os == 'Windows'
        shell: pwsh
        run: |
          $rgVersion = $env:RIPGREP_VERSION
          if ([string]::IsNullOrWhiteSpace($rgVersion)) {
              throw "RIPGREP_VERSION must be set"
          }
          $archive = "ripgrep-$rgVersion-${{ matrix.rg_target }}.zip"
          $tmpDir = Join-Path $env:RUNNER_TEMP "ripgrep"
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
          $archivePath = Join-Path $tmpDir $archive
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$rgVersion/$archive" -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $tmpDir -Force
          $rg = Get-ChildItem -Recurse -Filter "rg.exe" -Path $tmpDir | Select-Object -First 1
          if (-not $rg) {
              throw "rg.exe not found in $archive"
          }
          Get-Item $rg.FullName | Select-Object FullName, Length
          "DEVO_DESKTOP_RUNTIME_RG_BIN=$($rg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── CLI archive (skipped for desktop-only targets) ────────────────────
      - name: Prepare CLI staging directory
        if: matrix.package_cli
        shell: bash
        run: |
          staging=devo-tui-${{ github.ref_name }}-${{ env.RELEASE_TARGET }}
          bun scripts/runtime/bundle.ts "${{ matrix.target }}" "$staging" "$DEVO_DESKTOP_RUNTIME_RG_BIN" "target/${{ matrix.target }}/release"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      - name: Verify private runtimes outside the checkout
        shell: bash
        run: |
          bun scripts/runtime/smoke.ts "${{ env.STAGING }}"

      - name: Create online app and cached runtime packs
        shell: bash
        run: bun scripts/runtime/packs.ts "${{ env.STAGING }}" online-assets

      - name: Create tar.gz archive (Linux/macOS)
        if: matrix.package_cli && runner.os != 'Windows'
        run: tar czf "${{ env.STAGING }}.tar.gz" "${{ env.STAGING }}"

      - name: Create zip archive (Windows)
        if: matrix.package_cli && runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "$env:STAGING"
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"

      - uses: actions/upload-artifact@v4
        if: matrix.package_cli
        with:
          name: devo-tui-${{ github.ref_name }}-${{ env.RELEASE_TARGET }}
          path: ${{ env.STAGING }}.*

      - uses: actions/upload-artifact@v4
        if: matrix.package_cli
        with:
          name: devo-online-${{ matrix.target }}
          path: online-assets/*

      # ── Desktop package (reuses the binary compiled above) ────────────────
      - name: Install desktop dependencies
        if: matrix.package_desktop
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build desktop frontend
        if: matrix.package_desktop
        working-directory: apps/desktop
        run: bun run build

      - name: Stage desktop runtime from release binary
        if: matrix.package_desktop
        working-directory: apps/desktop
        run: bun scripts/prepare-runtime.ts --target ${{ matrix.target }} --bundle-dir ../../${{ env.STAGING }}

      - name: Package desktop with electron-builder
        if: matrix.package_desktop
        working-directory: apps/desktop
        run: bunx electron-builder ${{ matrix.electron_args }} --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        if: matrix.package_desktop
        with:
          name: devo-desktop-${{ github.ref_name }}-${{ matrix.desktop_platform }}-${{ matrix.desktop_arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.rpm
            apps/desktop/release/*.yml
            apps/desktop/release/*.zip

  # ── Create GitHub Release ──────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect individual release assets
        run: bun apps/desktop/scripts/collect-release-assets.ts artifacts release-assets "${{ github.ref_name }}"

      - name: Generate release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## Install

          The online installer downloads the app and caches checksum-pinned private Node/Python runtime packs for reuse across upgrades. No system Node.js, Python, npm, pip, or Rust installation is required. Complete terminal archives remain self-contained and portable; keep their extracted files together.

          Terminal archives use the `devo-tui-` prefix; graphical installers use `devo-desktop-`. The terminal command remains `devo`.

          For offline installation, transfer the complete archive and use its included installer with `--offline` (Unix) or `-Offline` (Windows). Cloud inference still requires connectivity; use a compatible preloaded local or LAN model for disconnected use.

          ### Linux / macOS

          ```bash
          curl -fsSL https://raw.githubusercontent.com/7df-lab/devo/main/install.sh | sh
          ```

          ### Windows

          ```powershell
          irm 'https://raw.githubusercontent.com/7df-lab/devo/main/install.ps1' | iex
          ```
          ---
          NOTES

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: true
          files: release-assets/*
          generate_release_notes: true
