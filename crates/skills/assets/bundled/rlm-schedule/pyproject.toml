# Kernel-side package for the bundled schedule skill. The Devo kernel provides
# rlm.host_request, so no additional dependency is needed.
[project]
name = "rlm-schedule"
version = "0.1.0"
description = "Devo skill for scheduling recurring agent checks"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm_schedule"]
